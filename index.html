<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name1" placeholder="Enter Your Name" minlength="5" maxlength="10" required>

        <label for="email">Email:</label>
        <input type="email" name="email" id="email1" placeholder="Enter Your Email" required>

        <label for="password">Password:</label>
        <input type="password" name="password" id="password1" placeholder="Enter Your Password" minlength="5" maxlength="15" required>
        <br>
        <br>

        <textarea name="message" id="message1" cols="20" rows="10" placeholder="Write a Comment" ></textarea>


        <label for="country">Country:</label>
        <select name="country" id="country1">

            <option value="">Select Your Country</option>
            <option value="uae">UAE</option>
            <option value="usa">USA</option>
            <option value="pakistan">Pakistan</option>
            <option value="india">India</option>
            <option value="iran">Iran</option>
            <option value="china">China</option>

            <input type="submit" value="Submit">
            <br>
            <video src="./Welcome to Foldables _ Samsung.mp4" height="300" width="280" muted controls poster="./images.jpg"></video>
            <img src="./images.jpg" alt="">
            <audio src="./Welcome to Foldables _ Samsung.mp4" muted controls></audio>
        
    </form>
</body>
</html>
